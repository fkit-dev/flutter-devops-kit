name: theme

display_name: Theme

description: Material 3 theme with light, dark and system mode.

version: 1.0.0

options:

  primary_color:
    type: color
    prompt: Primary color
    default: "#2563EB"

  secondary_color:
    type: color
    prompt: Secondary color (leave empty to derive automatically)
    default: "auto"

  success_color:
    type: color
    prompt: Success color
    default: "#16A34A"

  warning_color:
    type: color
    prompt: Warning color
    default: "#F59E0B"

  error_color:
    type: color
    prompt: Error color
    default: "#DC2626"

  enable_dark_theme:
    type: bool
    prompt: Enable dark theme?
    default: true

  generate_gradient:
    type: bool
    prompt: Generate primary gradient?
    default: false

files:

  - template: app_color.dart.tpl
    output: lib/app/theme/app_color.dart

  - template: app_theme.dart.tpl
    output: lib/app/theme/app_theme.dart

  - template: theme_state.dart.tpl
    output: lib/app/theme/theme_state.dart

  - template: theme_cubit.dart.tpl
    output: lib/app/theme/theme_cubit.dart

  - template: app_typography.dart.tpl
    output: lib/app/theme/app_typography.dart

  - template: theme_constants.dart.tpl
    output: lib/app/theme/theme_constants.dart

  - template: xcore.dart.tpl
    output: lib/app/theme/xcore.dart

requires:
  packages:
    flutter_bloc: ^9.1.0
    hive_flutter: ^1.1.0
    freezed_annotation: ^3.1.0

  dev_packages:
    build_runner: ^2.5.4
    freezed: ^3.2.3

  flutter_gen: false
  build_runner: true
