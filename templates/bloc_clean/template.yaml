schema: 2

name: bloc_clean

display_name: BLoC Clean Architecture

description: Feature-first Clean Architecture using flutter_bloc

version: 1.0.0

author: FKIT

documentation:
  overview: >
    Feature-first Clean Architecture using flutter_bloc.
    Uses Freezed, json_serializable and build_runner.

  notes:
    - Feature generation creates a complete feature module.
     - DTO and Entity use Freezed.
    - Run "fkit make resource auth Login" to generate resource files.

setup:
  modules:
    - theme
    - router
    - network

  features:
    - auth

  bootstrap:
    enabled: true

    app:
      template: bootstrap/app.dart.tpl
      output: lib/app/view/app.dart

    main:
      template: bootstrap/main.dart.tpl
      output: lib/main.dart

requires:
  packages:
    get_it: ^9.2.1
    flutter_bloc: ^9.1.0
    freezed_annotation: ^3.1.0
    json_annotation: ^4.12.0

  dev_packages:
    build_runner: ^2.5.4
    freezed: ^3.2.3
    json_serializable: ^6.9.5

  flutter_gen: false
  build_runner: true

supports:
  - feature
  - bloc
  - entity
  - dto
  - mapper
  - repository
  - usecase

files:
  feature: template/feature.yaml
  components: template/components.yaml
  groups: template/groups.yaml
  barrel: template/barrel.yaml
  di: template/di.yaml
  router: template/router.yaml
  modules: template/modules.yaml
