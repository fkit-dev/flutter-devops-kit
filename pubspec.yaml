name: flutter_devops_kit

description: FKIT (Flutter DevOps Kit) is a CLI toolkit for Flutter build automation, code generation, Firebase distribution, reusable modules, and project workflows.

version: 0.1.3

homepage: https://github.com/fkit-dev/flutter-devops-kit
repository: https://github.com/fkit-dev/flutter-devops-kit
issue_tracker: https://github.com/fkit-dev/flutter-devops-kit/issues
documentation: https://github.com/fkit-dev/flutter-devops-kit#readme

screenshots:
  - description: FKIT - Flutter DevOps Toolkit
    path: assets/branding/pub_thumbnail.png

  - description: FKIT command line interface
    path: assets/branding/fkit_banner.png

topics:
  - flutter
  - cli
  - automation
  - devops
  - code-generation

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  analyzer: ^14.0.0
  args: ^2.7.0
  mason_logger: ^0.3.5
  package_config: ^3.0.0
  path: ^1.9.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  fkit: