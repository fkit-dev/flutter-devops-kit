name: flutter_devops_kit

description: >
  FKIT (Flutter DevOps Kit) is a CLI for Flutter toolkit for build automation, Firebase distribution,
  Android signing, feature scaffolding, reusable modules,
  code generation, and project workflows.

version: 0.1.2

homepage: https://github.com/TejasD36/flutter-devops-kit
repository: https://github.com/TejasD36/flutter-devops-kit
issue_tracker: https://github.com/TejasD36/flutter-devops-kit/issues
documentation: https://github.com/TejasD36/flutter-devops-kit#readme

topics:
  - flutter
  - cli
  - automation
  - devops
  - code-generation

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  analyzer: ^14.0.0
  args: ^2.7.0
  mason_logger: ^0.3.5
  package_config: ^3.0.0
  path: ^1.9.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  fkit: