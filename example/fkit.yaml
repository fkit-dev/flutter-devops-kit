# =============================================================================
# FKIT Configuration
# =============================================================================
#
# Project configuration used by Flutter DevOps Kit.
#
# Run:
#   fkit init
#
# to generate the initial project configuration.
#
# Run:
#   fkit config
#
# to print the currently loaded configuration.
#
# =============================================================================

fkit:
  version: 0.1.1


# =============================================================================
# Project
# =============================================================================

project_name: scoreloan


# =============================================================================
# Tooling
# =============================================================================
#
# use_fvm:
#   true  -> Commands run through FVM.
#   false -> Commands use the globally installed Flutter SDK.
#
# Example:
#   true  -> fvm flutter pub get
#   false -> flutter pub get
#
# =============================================================================

tooling:
  use_fvm: false


# =============================================================================
# Platforms
# =============================================================================
#
# Defines the platforms supported by the project.
#
# =============================================================================

platforms:
  android: true
  ios: true
  web: true


# =============================================================================
# Generator
# =============================================================================
#
# Defines the architecture template and feature output directory used by FKIT
# generators.
#
# Available templates:
#   - bloc_clean
#
# Examples:
#   fkit feat auth
#   fkit make screen auth
#   fkit install theme
#   fkit setup
#
# =============================================================================

generator:
  feature_dir: lib/features
  default_template: bloc_clean


# =============================================================================
# Build
# =============================================================================
#
# debug_info:
#   Directory used to store obfuscation debug symbols.
#
# obfuscate:
#   Enables Dart code obfuscation for supported release builds.
#
# =============================================================================

build:
  debug_info: ./debug-info
  obfuscate: true


# =============================================================================
# Application Entry Point
# =============================================================================

entry:
  main: lib/main.dart


# =============================================================================
# Flavoring
# =============================================================================
#
# enabled:
#   Enables flavor-aware run, build, Firebase distribution, environment, and
#   other target-based workflows.
#
# default:
#   Target used when no explicit target is provided.
#
# Projects without flavors use:
#
#   enabled: false
#   default: main
#
# =============================================================================

flavoring:
  enabled: true
  default: development


# =============================================================================
# Targets / Flavors
# =============================================================================
#
# Defines the available project targets.
#
# When flavoring is enabled, these values represent application flavors.
#
# When flavoring is disabled, FKIT uses:
#
#   flavors:
#     - main
#
# Environment and Firebase configuration are intentionally defined separately.
#
# =============================================================================

flavors:
  - development
  - staging
  - production


# =============================================================================
# Environment
# =============================================================================
#
# Environment configuration is independent from application flavoring.
#
# enabled:
#   Enables --dart-define-from-file support for run and build commands.
#
# configurations:
#   Maps each project target to its environment file.
#
# A project without flavors may use:
#
#   configurations:
#     main:
#       file: env/env.json
#
# =============================================================================

environment:
  enabled: true

  configurations:
    development:
      file: env/development.json

    staging:
      file: env/staging.json

    production:
      file: env/production.json


# =============================================================================
# Firebase
# =============================================================================
#
# Firebase configuration is independent from application flavoring and
# environment configuration.
#
# enabled:
#   Enables Firebase workflows.
#
# tester_group:
#   Default Firebase App Distribution tester group.
#
# configurations:
#   Maps each project target to its platform-specific Firebase configuration.
#
# app_id:
#   Firebase App Distribution application identifier.
#
# options:
#   Path to the generated FlutterFire options file.
#
# Example:
#   fkit firebase production
#
# Override tester group:
#   fkit firebase production -g qa
#
# =============================================================================

firebase:
  enabled: true

  tester_group: internal-testers

  configurations:
    development:
      android:
        app_id: YOUR_DEVELOPMENT_ANDROID_APP_ID
        options: lib/firebase_options_development.dart

      ios:
        app_id: YOUR_DEVELOPMENT_IOS_APP_ID
        options: lib/firebase_options_development.dart

      web:
        app_id: YOUR_DEVELOPMENT_WEB_APP_ID
        options: lib/firebase_options_development.dart

    staging:
      android:
        app_id: YOUR_STAGING_ANDROID_APP_ID
        options: lib/firebase_options_staging.dart

      ios:
        app_id: YOUR_STAGING_IOS_APP_ID
        options: lib/firebase_options_staging.dart

      web:
        app_id: YOUR_STAGING_WEB_APP_ID
        options: lib/firebase_options_staging.dart

    production:
      android:
        app_id: YOUR_PRODUCTION_ANDROID_APP_ID
        options: lib/firebase_options_production.dart

      ios:
        app_id: YOUR_PRODUCTION_IOS_APP_ID
        options: lib/firebase_options_production.dart

      web:
        app_id: YOUR_PRODUCTION_WEB_APP_ID
        options: lib/firebase_options_production.dart


# =============================================================================
# Localization
# =============================================================================
#
# enabled:
#   Enables Flutter localization support.
#
# arb_dir:
#   Directory containing ARB localization files.
#
# template:
#   Template ARB file used by Flutter gen-l10n.
#
# output_dir:
#   Directory containing generated localization files.
#
# output_file:
#   Generated localization Dart file.
#
# default_locale:
#   Default application locale.
#
# locales:
#   Supported application locales.
#
# Commands:
#   fkit l10n setup
#   fkit l10n generate
#   fkit l10n doctor
#
# =============================================================================

localization:
  enabled: true

  arb_dir: lib/l10n

  template: app_en.arb

  output_dir: lib/gen/l10n

  output_file: app_localizations.dart

  default_locale: en

  locales:
    - en
    - mr
    - hi