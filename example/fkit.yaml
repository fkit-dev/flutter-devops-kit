project_name: scoreloan

tooling:
  use_fvm: false

platforms:
  android: true
  ios: true
  web: true

build:
  debug_info: ./debug-info
  obfuscate: true

entry:
  main: lib/main.dart

flavoring:
  enabled: true

flavors:
  default: development

  development:
    env: env/development.json

    firebase:
      app_distribution_id: YOUR_ANDROID_APP_ID

      options:
        android: lib/firebase/firebase_options_development.dart
        ios: lib/firebase/firebase_options_development.dart
        web: lib/firebase/firebase_options_development.dart

  staging:
    env: env/staging.json

    firebase:
      app_distribution_id: YOUR_STAGING_APP_ID

      options:
        android: lib/firebase/firebase_options_staging.dart
        ios: lib/firebase/firebase_options_staging.dart
        web: lib/firebase/firebase_options_staging.dart

  production:
    env: env/production.json

    firebase:
      app_distribution_id: YOUR_PRODUCTION_APP_ID

      options:
        android: lib/firebase/firebase_options_production.dart
        ios: lib/firebase/firebase_options_production.dart
        web: lib/firebase/firebase_options_production.dart

firebase:
  tester_group: internal-testers