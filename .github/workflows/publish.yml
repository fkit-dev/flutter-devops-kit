name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify tag matches pubspec version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]]+)['\"]?.*$/\1/p" pubspec.yaml | head -n 1)"

          if ! printf '%s\n' "$tag_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "Tag ${GITHUB_REF_NAME} is not a supported pub version tag. Use v<pubspec-version>, for example v0.1.4."
            exit 1
          fi

          if [ -z "$pubspec_version" ]; then
            echo "Could not read version from pubspec.yaml."
            exit 1
          fi

          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "Tag version $tag_version does not match pubspec.yaml version $pubspec_version."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Validate package
        run: dart pub publish --dry-run

  publish:
    name: Publish package
    needs: verify
    permissions:
      contents: read
      id-token: write

    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # If pub.dev automated publishing is configured to require a GitHub
    # environment, uncomment the following lines and create the same environment
    # in GitHub repository settings.
    # with:
    #   environment: pub.dev
